---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maplestory-unity
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/FreekingDean/MapleStory
    githubConfigSecret: maplestory-unity-runner
    runnerScaleSetName: maplestory-unity
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: actions-runner-system
      name: actions-runner-controller
    template:
      spec:
        securityContext:
          fsGroup: 123
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/actions/actions-runner:latest
            command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          - name: dind
            image: docker:29-dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            resources:
              requests:
                cpu: "4"
                memory: 12Gi
              limits:
                memory: 16Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              - name: docker-data
                mountPath: /var/lib/docker
              - name: game-ci
                mountPath: /home/runner/.game-ci
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
              - name: ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT
                value: "1"
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: game-ci
                mountPath: /home/runner/.game-ci
        volumes:
          - name: work
            persistentVolumeClaim:
              claimName: maplestory-unity-work
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
          - name: game-ci
            emptyDir: {}
          - name: docker-data
            persistentVolumeClaim:
              claimName: maplestory-unity-docker
