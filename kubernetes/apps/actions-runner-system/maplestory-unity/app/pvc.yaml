---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maplestory-unity-work
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  storageClassName: replica-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maplestory-unity-docker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi
  storageClassName: replica-block
