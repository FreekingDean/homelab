---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-maplestory-unity-runner
  namespace: flux-system
spec:
  path: ./kubernetes/apps/actions-runner-system/maplestory-unity/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: cluster-apps-actions-runner-controller
  interval: 30m
  retryInterval: 1m
  timeout: 5m
