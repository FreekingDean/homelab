---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/instance: ghost
    app.kubernetes.io/name: ghost
  name: ghost-public
spec:
  parentRefs:
    - kind: ListenerSet
      name: arcolog-com-listener-set
      namespace: networking
  hostnames:
    - blog.arcolog.com
    - www.arcolog.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ghost
          port: 2368
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/instance: ghost
    app.kubernetes.io/name: ghost
  name: ghost-apex
spec:
  parentRefs:
    - kind: ListenerSet
      name: arcolog-com-listener-set
      namespace: networking
  hostnames:
    - arcolog.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: www.arcolog.com
            statusCode: 301
