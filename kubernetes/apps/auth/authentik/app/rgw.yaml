---
# Authentik serves files as presigned S3 URLs, so browsers fetch them straight
# from RGW. RGW is only on the LAN over plain HTTP, so expose it read-only
# (GET/HEAD) on a public HTTPS hostname. Every object is private, so a request
# only works with a valid presigned signature from Authentik.
apiVersion: v1
kind: Service
metadata:
  name: &app rgw
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
spec:
  clusterIP: None
  ports:
    - name: http
      port: &port 7480
      protocol: TCP
      targetPort: *port
---
apiVersion: v1
kind: Endpoints
metadata:
  name: &app rgw
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
subsets:
  - addresses:
      - ip: 10.0.0.104
    ports:
      - name: http
        port: 7480
        protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-media
spec:
  parentRefs:
    - kind: ListenerSet
      name: deangalvin-dev-listener-set
      namespace: networking
  hostnames:
    - authentik-media.deangalvin.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: GET
        - path:
            type: PathPrefix
            value: /
          method: HEAD
      backendRefs:
        - name: rgw
          port: 7480
