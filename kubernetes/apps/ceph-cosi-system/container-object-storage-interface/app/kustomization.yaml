---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - "https://github.com/kubernetes-sigs/container-object-storage-interface?ref=v0.2.2"
patches:
  - path: overlay/delete-namespace.yaml
images:
  # The upstream v0.2.2 manifests still reference a Sept 2025 pre-release staging
  # build of the controller; run the release that matches the CRDs instead.
  - name: gcr.io/k8s-staging-sig-storage/objectstorage-controller
    newTag: v0.2.2
