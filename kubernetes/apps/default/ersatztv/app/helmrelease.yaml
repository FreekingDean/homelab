---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ersatztv
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 0.0.14
      sourceRef:
        kind: HelmRepository
        name: freekingdean
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    service:
      app:
        labels:
          istio.io/use-waypoint: none
    stateful: true
    persistence:
      config:
        existingClaim: ersatztv-config
        type: persistentVolumeClaim
      media:
        existingClaim: replica-media
        type: persistentVolumeClaim
      ec-media:
        existingClaim: ec-media
        type: persistentVolumeClaim
    image:
      repository: ghcr.io/ersatztv/ersatztv
      tag: v26.3.0
    env:
      TZ: America/New_York
    ports:
      http: 8409
    ingress:
      enabled: false
    serviceMonitor:
      enabled: false
