---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hajimari
spec:
  parentRefs:
    - name: main
      namespace: networking
  hostnames:
    - apps.deangalvin.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hajimari
          port: 3000
