apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojellyfin-web
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gojellyfin
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojellyfin
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: client
          image: jellyfin/jellyfin:10.11.11
          command: ["cp", "-a", "/jellyfin/jellyfin-web/.", "/client/"]
          volumeMounts:
            - name: client
              mountPath: /client
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: client
              mountPath: /usr/share/nginx/html/web
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /web/index.html
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /web/index.html
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: client
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojellyfin-worker
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gojellyfin
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojellyfin
        app.kubernetes.io/component: worker
        version: v1
    spec:
      containers:
        - name: gojellyfin
          image: ghcr.io/freekingdean/gojellyfin:main
          imagePullPolicy: Always
          args: ["worker"]
          env:
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tmdb
                  key: apikey
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_HOSTPORT
              value: "temporal-frontend.temporal:7233"
            - name: PUBLISHED_SERVER_URL
              value: "https://gojellyfin.deangalvin.dev"
            - name: DATABASE_URL 
              valueFrom:
                secretKeyRef:
                  name: postgres-jellyfin-app
                  key: uri
          volumeMounts:
            - name: ec-media
              mountPath: /ec-media
      volumes:
        - name: ec-media
          persistentVolumeClaim:
            claimName: ec-media
