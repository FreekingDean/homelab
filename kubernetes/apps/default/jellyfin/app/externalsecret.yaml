---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tmdb-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tmdb 
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        apikey: "{{ .apikey }}"
  dataFrom:
    - extract:
        key: tmdb
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gojellyfin-oidc-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gojellyfin-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: jellyfin
