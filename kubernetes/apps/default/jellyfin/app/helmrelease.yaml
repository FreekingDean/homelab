---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 0.0.14
      sourceRef:
        kind: HelmRepository
        name: freekingdean
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: monitoring/default
    service:
      app:
        labels:
          istio.io/use-waypoint: none
    stateful: true
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: jellyfin-config
      media:
        type: persistentVolumeClaim
        existingClaim: replica-media
      cache:
        type: persistentVolumeClaim
        existingClaim: jellyfin-cache
      ec-media:
        type: persistentVolumeClaim
        existingClaim: ec-media
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
    image:
      repository: ghcr.io/jellyfin/jellyfin
      tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
    env:
      JELLYFIN_FFmpeg__probesize: 10000000000
      JELLYFIN_FFmpeg__analyzeduration: 2000000000
      TZ: America/New_York
    resources:
      requests:
        cpu: 8
        memory: 32Gi
      limits:
        memory: 64Gi
    ports:
      http: 8096
    ingress:
      enabled: false
    serviceMonitor:
      enabled: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gojellyfin
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 0.0.14
      sourceRef:
        kind: HelmRepository
        name: freekingdean
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      annotations:
        instrumentation.opentelemetry.io/inject-go: monitoring/default
    controllers:
      gojellyfin:
        containers:
          gojellyfin:
            imagePullPolicy: Always
            args: ["server"]
            env:
              - name: PUBLISHED_SERVER_URL
                value: "https://gojellyfin.deangalvin.dev"
              - name: TRANSCODER_TOKEN
                value: bad-token
              - name: TRANSCODER_WORKERS
                value: >-
                  gojellyfin-transcode-0.gojellyfin-transcode-headless,
                  gojellyfin-transcode-1.gojellyfin-transcode-headless,
                  gojellyfin-transcode-2.gojellyfin-transcode-headless,
                  gojellyfin-transcode-3.gojellyfin-transcode-headless,
                  gojellyfin-transcode-4.gojellyfin-transcode-headless
              - name: DATABASE_URL 
                valueFrom:
                  secretKeyRef:
                    name: postgres-jellyfin-app
                    key: uri
    persistence:
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
      media:
        type: persistentVolumeClaim
        existingClaim: replica-media
      ec-media:
        type: persistentVolumeClaim
        existingClaim: ec-media
    image:
      repository: ghcr.io/freekingdean/gojellyfin
      tag: main
    resources:
      requests:
        cpu: 2
        memory: 8Gi
      limits:
        memory: 16Gi
    ports:
      http: 8081
    ingress:
      enabled: false
    serviceMonitor:
      enabled: false
