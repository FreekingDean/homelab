---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 0.0.14
      sourceRef:
        kind: HelmRepository
        name: freekingdean
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      labels:
        istio.io/use-waypoint: none
        istio.io/dataplane-mode: none
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: monitoring/default
    service:
      app:
        labels:
          istio.io/use-waypoint: none
    stateful: true
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: jellyfin-config
      media:
        type: persistentVolumeClaim
        existingClaim: replica-media
      cache:
        type: persistentVolumeClaim
        existingClaim: jellyfin-cache
      ec-media:
        type: persistentVolumeClaim
        existingClaim: ec-media
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
    image:
      repository: ghcr.io/jellyfin/jellyfin
      tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
    env:
      JELLYFIN_FFmpeg__probesize: 10000000000
      JELLYFIN_FFmpeg__analyzeduration: 2000000000
      TZ: America/New_York
    resources:
      requests:
        cpu: 8
        memory: 32Gi
      limits:
        memory: 64Gi
    ports:
      http: 8096
    ingress:
      enabled: false
    serviceMonitor:
      enabled: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gojellyfin
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: gojellyfin
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    hostname: gojellyfin.deangalvin.dev
    database:
      existingSecret: postgres-jellyfin-app
      secretKey: uri
    tmdb:
      existingSecret: tmdb
      secretKey: apikey
    temporal:
      hostPort: temporal-frontend.temporal:7233
      namespace: default
    tracing:
      otlpEndpoint: http://$(HOST_IP):4317
    media:
      mountPath: /ec-media
      directories:
        - /ec-media
        - /media
      volume:
        persistentVolumeClaim:
          claimName: ec-media
    migration:
      enabled: true
    api:
      resources:
        requests:
          cpu: 2
          memory: 8Gi
        limits:
          cpu: null
          memory: 16Gi
      pod:
        annotations:
          version: v1
          instrumentation.opentelemetry.io/inject-go: monitoring/default
    streaming:
      pod:
        annotations:
          version: v1
          instrumentation.opentelemetry.io/inject-go: monitoring/default
    worker:
      enabled: true
      replicas: 3
    web:
      client:
        tag: 10.11.11
    httpRoute:
      enabled: true
      parentRefs:
        - kind: ListenerSet
          name: deangalvin-dev-listener-set
          namespace: networking
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              labelSelector: app.kubernetes.io/component in (api,streaming)
            patch: |
              - op: add
                path: /spec/template/metadata/labels/istio.io~1use-waypoint
                value: none
              - op: add
                path: /spec/template/metadata/labels/istio.io~1dataplane-mode
                value: none
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: replica-media
                  persistentVolumeClaim:
                    claimName: replica-media
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: replica-media
                  mountPath: /media
          - target:
              kind: Deployment
              labelSelector: app.kubernetes.io/component in (api,streaming,worker)
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/0
                value:
                  name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
          - target:
              kind: Service
              labelSelector: app.kubernetes.io/component in (api,streaming)
            patch: |
              - op: add
                path: /metadata/labels/istio.io~1use-waypoint
                value: none
