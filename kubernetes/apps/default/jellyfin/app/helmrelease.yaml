---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 0.0.14
      sourceRef:
        kind: HelmRepository
        name: freekingdean
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      labels:
        istio.io/use-waypoint: none
        istio.io/dataplane-mode: none
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: monitoring/default
    service:
      app:
        labels:
          istio.io/use-waypoint: none
    stateful: true
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: jellyfin-config
      media:
        type: persistentVolumeClaim
        existingClaim: replica-media
      cache:
        type: persistentVolumeClaim
        existingClaim: jellyfin-cache
      ec-media:
        type: persistentVolumeClaim
        existingClaim: ec-media
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
    image:
      repository: ghcr.io/jellyfin/jellyfin
      tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
    env:
      JELLYFIN_FFmpeg__probesize: 10000000000
      JELLYFIN_FFmpeg__analyzeduration: 2000000000
      TZ: America/New_York
    resources:
      requests:
        cpu: 8
        memory: 32Gi
      limits:
        memory: 64Gi
    ports:
      http: 8096
    ingress:
      enabled: false
    serviceMonitor:
      enabled: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gojellyfin
spec:
  interval: 15m
  chart:
    spec:
      chart: ./charts/gojellyfin
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: gojellyfin
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/freekingdean/gojellyfin
      tag: main
      pullPolicy: Always
    hostname: gojellyfin.deangalvin.dev
    httpPort: 8081
    database:
      existingSecret: postgres-jellyfin-app
      secretKey: uri
    tmdb:
      existingSecret: tmdb
      secretKey: apikey
    temporal:
      hostPort: temporal-frontend.temporal:7233
      namespace: default
    media:
      mountPath: /ec-media
      volume:
        persistentVolumeClaim:
          claimName: ec-media
    api:
      replicaCount: 2
      podAnnotations:
        instrumentation.opentelemetry.io/inject-go: monitoring/default
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 8Gi
    streaming:
      enabled: true
      replicaCount: 2
      podAnnotations:
        instrumentation.opentelemetry.io/inject-go: monitoring/default
      resources:
        requests:
          cpu: "2"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 8Gi
    worker:
      enabled: true
      replicaCount: 3
      mediaReadOnly: false
      podAnnotations:
        instrumentation.opentelemetry.io/inject-go: monitoring/default
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 4Gi
    web:
      replicaCount: 2
      client:
        tag: "10.11.11"
    httpRoute:
      enabled: true
      parentRefs:
        - name: main
          namespace: networking
