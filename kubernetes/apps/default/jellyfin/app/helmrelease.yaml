---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 0.0.14
      sourceRef:
        kind: HelmRepository
        name: freekingdean
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      labels:
        istio.io/use-waypoint: none
        istio.io/dataplane-mode: none
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: monitoring/default
    service:
      app:
        labels:
          istio.io/use-waypoint: none
    stateful: true
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: jellyfin-config
      media:
        type: persistentVolumeClaim
        existingClaim: replica-media
      cache:
        type: persistentVolumeClaim
        existingClaim: jellyfin-cache
      ec-media:
        type: persistentVolumeClaim
        existingClaim: ec-media
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
    image:
      repository: ghcr.io/jellyfin/jellyfin
      tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
    env:
      JELLYFIN_FFmpeg__probesize: 10000000000
      JELLYFIN_FFmpeg__analyzeduration: 2000000000
      TZ: America/New_York
    resources:
      requests:
        cpu: 8
        memory: 32Gi
      limits:
        memory: 64Gi
    ports:
      http: 8096
    ingress:
      enabled: false
    serviceMonitor:
      enabled: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gojellyfin
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: gojellyfin
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    chartNameChangeStrategy: Reinstall
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: Secret
      name: gojellyfin-oidc
      valuesKey: OIDC_CLIENT_ID
      targetPath: oidc.clientId
  values:
    hostname: jellyfin.deangalvin.dev
    env:
      - name: SERVER_ID
        value: e10a32fca79342d7b8b9d96e255ce1bc
      - name: "SOURCE_API_KEY_DEFAULT"
        value: "this-is-a-bad-api-key"
      - name: HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    database:
      existingSecret: postgres-jellyfin-app
      secretKey: uri
    tmdb:
      existingSecret: tmdb
      secretKey: apikey
    # The Authentik provider's redirect URI is
    # https://jellyfin.deangalvin.dev/sso/oidc/callback. Its client id and
    # secret come from the 1Password item "jellyfin" through the
    # gojellyfin-oidc ExternalSecret; clientId is filled in by valuesFrom
    # above, so it must not be set here, where it would win.
    oidc:
      issuerUrl: https://authentik.deangalvin.dev/application/o/gojellyfin/
      existingSecret: gojellyfin-oidc
      linkExistingUsers: true
    # The Cilium pod network, so the gateway and waypoint pass on the client's
    # address in X-Forwarded-For.
    trustedProxies:
      - 10.201.0.0/16
    temporal:
      hostPort: temporal-frontend.temporal:7233
      namespace: default
    tracing:
      otlpEndpoint: http://$(HOST_IP):4318
    media:
      mountPath: /ec-media
      volume:
        persistentVolumeClaim:
          claimName: ec-media
      extraVolumes:
        - name: replica-media
          mountPath: /media
          volume:
            persistentVolumeClaim:
              claimName: replica-media
    migration:
      enabled: true
    api:
      resources:
        requests:
          cpu: 2
          memory: 8Gi
        limits:
          cpu: null
          memory: 16Gi
      pod:
        labels:
          istio.io/use-waypoint: none
          istio.io/dataplane-mode: none
        annotations:
          version: v1
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 6
      podDisruptionBudget:
        enabled: true
    streaming:
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 8
      podDisruptionBudget:
        enabled: true
      pod:
        labels:
          istio.io/use-waypoint: none
          istio.io/dataplane-mode: none
        annotations:
          version: v1
    worker:
      enabled: true
      resources:
        requests:
          cpu: 1
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 6
      podDisruptionBudget:
        enabled: true
    web:
      client:
        tag: "12.4"
      podDisruptionBudget:
        enabled: true
    service:
      labels:
        istio.io/use-waypoint: none
    httpRoute:
      enabled: true
      parentRefs:
        - kind: ListenerSet
          name: deangalvin-dev-listener-set
          namespace: networking
