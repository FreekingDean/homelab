---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
  - ./pgcluster.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: gojellyfin-dashboard
    files:
      - ./dashboards/gojellyfin.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
