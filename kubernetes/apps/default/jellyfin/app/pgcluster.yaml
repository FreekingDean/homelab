---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-jellyfin
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  primaryUpdateStrategy: unsupervised
  storage:
    size: 600Gi
    storageClass: replica-block
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 4Gi
  monitoring:
    enablePodMonitor: true
