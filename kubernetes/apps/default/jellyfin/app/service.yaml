apiVersion: v1
kind: Service
metadata:
  name: gojellyfin-transcode-headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: gojellyfin-transcode
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: gojellyfin-web
  labels:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gojellyfin
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
