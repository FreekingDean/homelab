apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-config
  labels:
    app.kubernetes.io/instance: recyclarr
    app.kubernetes.io/name: recyclarr
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: replica-block
