---
# SECRET_KEY is Silo's master key for the credentials it stores. Nothing
# recovers them if it is lost, so it lives in 1Password, not only in the
# cluster. Generate it once with `openssl rand -base64 48` into the item
# "silo", field secret_key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secret_key }}"
  dataFrom:
    - extract:
        key: silo
---
# Secret server settings, loaded into the API pods by name. The chart wants
# the variable names as keys, so the existing tmdb item is re-keyed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-settings-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SILO_TMDB_API_KEY: "{{ .apikey }}"
  dataFrom:
    - extract:
        key: tmdb
---
# One node key per transcode pod, keyed by pod ordinal. Generate each once
# with a fresh id and store it in the "silo" item:
#   docker run --rm --entrypoint silo ghcr.io/silo-server/silo-server:build-1302 \
#     node-key generate --id 1001   # -> node_key_0
#   ... --id 1002                    # -> node_key_1
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-transcode-keys-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-transcode-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        "0": "{{ .node_key_0 }}"
        "1": "{{ .node_key_1 }}"
  dataFrom:
    - extract:
        key: silo
