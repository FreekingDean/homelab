---
# SECRET_KEY is Silo's master key for the credentials it stores. Nothing
# recovers them if it is lost, so it lives in 1Password, not only in the
# cluster. Generate it once with `openssl rand -base64 48` into the item
# "silo", field secret_key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secret_key }}"
  dataFrom:
    - extract:
        key: silo
---
# Secret server settings, loaded into the API pods by name. The chart wants
# the variable names as keys, so the existing tmdb item is re-keyed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-settings-external
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: silo-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SILO_TMDB_API_KEY: "{{ .apikey }}"
  dataFrom:
    - extract:
        key: tmdb
