---
# The charts are not published yet, so Flux builds this one from the branch of
# FreekingDean/silo-charts#1. Once that PR merges and the release workflow
# pushes v0.1.0, swap this for an OCIRepository like gojellyfin's:
#
#   apiVersion: source.toolkit.fluxcd.io/v1
#   kind: OCIRepository
#   metadata:
#     name: silo
#   spec:
#     interval: 15m
#     layerSelector:
#       mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
#       operation: copy
#     ref:
#       tag: 0.1.0
#     url: oci://ghcr.io/freekingdean/charts/silo
#
# and point the HelmRelease at it with chartRef.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: silo-charts
spec:
  interval: 15m
  url: https://github.com/FreekingDean/silo-charts
  # Pinned to a commit on the branch so a render is reproducible and picks
  # up chart changes only when this file changes.
  ref:
    branch: claude/project-thread-lwf282
    commit: 80c9356248858189fe2e06a217d1127023d9d49d
  ignore: |
    /*
    !/charts/silo
