---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  interval: 15m
  chart:
    spec:
      chart: ./charts/silo
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: silo-charts
  maxHistory: 3
  install:
    # First install waits on migrations, which can take a while.
    timeout: 25m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    timeout: 25m
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # A checkout of the chart defaults to latest. Upstream publishes no
    # semver tags, so pin a build.
    image:
      tag: build-1302

    hostname: silo.${DOMAIN}
    # jellyfin.deangalvin.dev already belongs to gojellyfin, so Silo's
    # Jellyfin-compatible listener gets a name of its own.
    jellyfin:
      hostname: silo-jf.${DOMAIN}
    timeZone: ${TIMEZONE}
    # The Cilium pod network, as for gojellyfin.
    trustedProxies:
      - 10.201.0.0/16

    secretKey:
      existingSecret: silo
    # CloudNativePG's app Secret already holds a full URI.
    database:
      existingSecret: postgres-silo-app
      secretKey: uri
    redis:
      existingSecret: silo-redis
    secretSettings:
      existingSecret: silo-settings
    # The same media at the same paths as gojellyfin, so both servers see one
    # library.
    media:
      mountPath: /ec-media
      volume:
        persistentVolumeClaim:
          claimName: ec-media
      extraVolumes:
        - name: replica-media
          mountPath: /media
          volume:
            persistentVolumeClaim:
              claimName: replica-media

    # Stateless: no PVC. Postgres and the two buckets hold the state; a
    # restart loses only the plugin cache (rebuilt from Postgres) and the
    # Jellyfin web client (reinstalled from admin settings).
    persistence:
      data:
        enabled: false
    # The buckets come from COSI (bucket.yaml). Each BucketAccess writes one
    # Secret holding a BucketInfo JSON document with a generated bucket name,
    # so the s3-env init container below unpacks both into an env file, and
    # the API reads each value from it with fileKeyRef (the cluster runs with
    # the EnvFiles feature gate). The env file format only takes single-quoted
    # values with no escapes, so a value holding ' fails the init container.
    # RGW is addressed by IP, so path style.
    settings:
      SILO_SERVER_NAME: Silo
      SILO_SIGNUP_ENABLED: "false"
      SILO_ARTWORK_STORAGE: s3
      SILO_S3_PUBLIC_REGION: us-east-1
      SILO_S3_PUBLIC_PATH_STYLE: "true"
      SILO_S3_PRIVATE_REGION: us-east-1
      SILO_S3_PRIVATE_PATH_STYLE: "true"

    metrics:
      enabled: true

    # Out of the mesh, like gojellyfin: the gateway talks to the pods
    # directly and streams skip the waypoint.
    pod:
      labels:
        istio.io/use-waypoint: none
        istio.io/dataplane-mode: none
    service:
      labels:
        istio.io/use-waypoint: none

    api:
      pod:
        initContainers:
          - name: s3-env
            image: docker.io/mikefarah/yq:4.54.1
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                out=/run/s3/s3.env
                : > "$out"
                put() {
                  v="$(yq -p json -o json -r "$3 // \"\"" "$1")"
                  if [ -z "$v" ]; then
                    echo "$1 has no $3" >&2
                    exit 1
                  fi
                  case "$v" in
                    *"'"*) echo "$1: $3 holds a single quote" >&2; exit 1 ;;
                  esac
                  printf "%s='%s'\n" "$2" "$v" >> "$out"
                }
                for b in public private; do
                  f="/cosi/$b/BucketInfo"
                  p="SILO_S3_$(echo "$b" | tr a-z A-Z)"
                  put "$f" "$p"_ENDPOINT .spec.secretS3.endpoint
                  put "$f" "$p"_BUCKET .spec.bucketName
                  put "$f" "$p"_ACCESS_KEY .spec.secretS3.accessKeyID
                  put "$f" "$p"_SECRET_KEY .spec.secretS3.accessSecretKey
                done
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: s3-env
                mountPath: /run/s3
              - name: cosi-public
                mountPath: /cosi/public
                readOnly: true
              - name: cosi-private
                mountPath: /cosi/private
                readOnly: true
      extraVolumes:
        - name: s3-env
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: cosi-public
          secret:
            secretName: silo-public-bucket-credentials
        - name: cosi-private
          secret:
            secretName: silo-private-bucket-credentials
      env:
        - name: SILO_S3_PUBLIC_ENDPOINT
          valueFrom:
            fileKeyRef:
              volumeName: s3-env
              path: s3.env
              key: SILO_S3_PUBLIC_ENDPOINT
        - name: SILO_S3_PUBLIC_BUCKET
          valueFrom:
            fileKeyRef:
              volumeName: s3-env
              path: s3.env
              key: SILO_S3_PUBLIC_BUCKET
        - name: SILO_S3_PUBLIC_ACCESS_KEY
          valueFrom:
            fileKeyRef:
              volumeName: s3-env
              path: s3.env
              key: SILO_S3_PUBLIC_ACCESS_KEY
        - name: SILO_S3_PUBLIC_SECRET_KEY
          valueFrom:
            fileKeyRef:
              volumeName: s3-env
              path: s3.env
              key: SILO_S3_PUBLIC_SECRET_KEY
        - name: SILO_S3_PRIVATE_ENDPOINT
          valueFrom:
            fileKeyRef:
              volumeName: s3-env
              path: s3.env
              key: SILO_S3_PRIVATE_ENDPOINT
        - name: SILO_S3_PRIVATE_BUCKET
          valueFrom:
            fileKeyRef:
              volumeName: s3-env
              path: s3.env
              key: SILO_S3_PRIVATE_BUCKET
        - name: SILO_S3_PRIVATE_ACCESS_KEY
          valueFrom:
            fileKeyRef:
              volumeName: s3-env
              path: s3.env
              key: SILO_S3_PRIVATE_ACCESS_KEY
        - name: SILO_S3_PRIVATE_SECRET_KEY
          valueFrom:
            fileKeyRef:
              volumeName: s3-env
              path: s3.env
              key: SILO_S3_PRIVATE_SECRET_KEY
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          memory: 8Gi
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
      podDisruptionBudget:
        enabled: true

    httpRoute:
      enabled: true
      parentRefs:
        - kind: ListenerSet
          name: deangalvin-dev-listener-set
          namespace: networking
