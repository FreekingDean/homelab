---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  interval: 15m
  chart:
    spec:
      chart: ./charts/silo
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: silo-charts
  maxHistory: 3
  install:
    # First install waits on migrations, which can take a while.
    timeout: 25m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    timeout: 25m
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # A checkout of the chart defaults to latest. Upstream publishes no
    # semver tags, so pin a build.
    image:
      tag: build-1302

    hostname: silo.${DOMAIN}
    # jellyfin.deangalvin.dev already belongs to gojellyfin, so Silo's
    # Jellyfin-compatible listener gets a name of its own.
    jellyfin:
      hostname: silo-jf.${DOMAIN}
    timeZone: ${TIMEZONE}
    # The Cilium pod network, as for gojellyfin.
    trustedProxies:
      - 10.201.0.0/16

    secretKey:
      existingSecret: silo
    # CloudNativePG's app Secret already holds a full URI.
    database:
      existingSecret: postgres-silo-app
      secretKey: uri
    redis:
      existingSecret: silo-redis
    secretSettings:
      existingSecret: silo-settings
    settings:
      SILO_SERVER_NAME: Silo
      SILO_SIGNUP_ENABLED: "false"
      SILO_ARTWORK_STORAGE: s3
      SILO_S3_PUBLIC_PATH_STYLE: "true"
      SILO_S3_PRIVATE_PATH_STYLE: "true"

    # The same media at the same paths as gojellyfin, so both servers see one
    # library.
    media:
      mountPath: /ec-media
      volume:
        persistentVolumeClaim:
          claimName: ec-media
      extraVolumes:
        - name: replica-media
          mountPath: /media
          volume:
            persistentVolumeClaim:
              claimName: replica-media

    # Stateless: no PVC. Postgres and the two buckets hold the state; a
    # restart loses only the plugin cache (rebuilt from Postgres) and the
    # Jellyfin web client (reinstalled from admin settings).
    persistence:
      data:
        enabled: false
    metrics:
      enabled: true

    # Out of the mesh, like gojellyfin: the gateway talks to the pods
    # directly and streams skip the waypoint.
    pod:
      labels:
        istio.io/use-waypoint: none
        istio.io/dataplane-mode: none
    service:
      labels:
        istio.io/use-waypoint: none

    api:
      # The buckets come from COSI (bucket.yaml). The cosi-bucket component
      # (ks.yaml) flattens each BucketAccess Secret into silo-<bucket>-bucket-s3,
      # so the API reads every value with secretKeyRef. RGW is addressed by IP,
      # so path style (settings above).
      env:
        - name: SILO_S3_PUBLIC_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: silo-public-bucket-s3
              key: AWS_ENDPOINT_URL
        - name: SILO_S3_PUBLIC_BUCKET
          valueFrom:
            secretKeyRef:
              name: silo-public-bucket-s3
              key: BUCKET_NAME
        - name: SILO_S3_PUBLIC_REGION
          valueFrom:
            secretKeyRef:
              name: silo-public-bucket-s3
              key: AWS_DEFAULT_REGION
        - name: SILO_S3_PUBLIC_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: silo-public-bucket-s3
              key: AWS_ACCESS_KEY_ID
        - name: SILO_S3_PUBLIC_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: silo-public-bucket-s3
              key: AWS_SECRET_ACCESS_KEY
        - name: SILO_S3_PRIVATE_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: silo-private-bucket-s3
              key: AWS_ENDPOINT_URL
        - name: SILO_S3_PRIVATE_BUCKET
          valueFrom:
            secretKeyRef:
              name: silo-private-bucket-s3
              key: BUCKET_NAME
        - name: SILO_S3_PRIVATE_REGION
          valueFrom:
            secretKeyRef:
              name: silo-private-bucket-s3
              key: AWS_DEFAULT_REGION
        - name: SILO_S3_PRIVATE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: silo-private-bucket-s3
              key: AWS_ACCESS_KEY_ID
        - name: SILO_S3_PRIVATE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: silo-private-bucket-s3
              key: AWS_SECRET_ACCESS_KEY
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          memory: 8Gi
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
      podDisruptionBudget:
        enabled: true

    httpRoute:
      enabled: true
      parentRefs:
        - kind: ListenerSet
          name: deangalvin-dev-listener-set
          namespace: networking
