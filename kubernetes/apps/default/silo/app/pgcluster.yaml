---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-silo
spec:
  instances: 3
  # Silo's schema migration sets transaction_timeout, which PostgreSQL only
  # has from 17, and its image's pg_dump is 18, so it needs exactly 18. The
  # standard images ship pgvector.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      # Silo opens up to 20 connections per process: up to 4 API pods here,
      # plus room for admin sessions.
      max_connections: "200"
      shared_buffers: 1GB
      pg_stat_statements.max: "10000"
  bootstrap:
    initdb:
      database: silo
      owner: silo
      # The app role CloudNativePG creates is not a superuser, and vector is
      # not a trusted extension, so create the three Silo needs here, as the
      # superuser, before it migrates.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS citext;
  storage:
    size: 50Gi
    storageClass: fast-replica-block
  monitoring:
    enablePodMonitor: true
