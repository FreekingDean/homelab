---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wizarr
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 0.0.14
      sourceRef:
        kind: HelmRepository
        name: freekingdean
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: monitoring/default
    stateful: true
    persistence:
      data:
        existingClaim: wizarr-config
        type: persistentVolumeClaim
      media:
        existingClaim: replica-media
        type: persistentVolumeClaim
    image:
      repository: ghcr.io/wizarrrr/wizarr
      tag: v2026.9.0
    env:
      DISABLE_BUILTIN_AUTH: "false"
      TZ: America/New_York
    ports:
      http: 5690
    ingress:
      enabled: false
    serviceMonitor:
      enabled: false
