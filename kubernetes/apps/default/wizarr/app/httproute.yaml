---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wizarr
spec:
  parentRefs:
    - name: main
      namespace: networking
  hostnames:
    - wizarr.deangalvin.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: wizarr
          port: 5690
