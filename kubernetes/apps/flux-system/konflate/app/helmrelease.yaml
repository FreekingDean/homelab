---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: "github://FreekingDean/homelab"
      statusChecks: true
      prComments: true
      publicUrl: "https://{{ .Release.Name }}.deangalvin.dev"
      mcp: false
      verifyImages: true
    secret:
      existingSecret: konflate-webhook-token-secret
    httpRoute:
      enabled: true
      parentRefs:
        - kind: ListenerSet
          name: deangalvin-dev-listener-set
          namespace: networking
      hostnames:
        - "{{ .Release.Name }}.deangalvin.dev"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
