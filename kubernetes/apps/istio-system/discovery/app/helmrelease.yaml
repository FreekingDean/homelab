---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-discovery
spec:
  interval: 15m
  chart:
    spec:
      chart: istiod
      version: 1.30.3
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    profile: ambient
    gatewayClasses:
      istio:
        deployment:
          spec:
            replicas: 3
        service:
          spec:
            externalTrafficPolicy: Local
    meshConfig:
      extensionProviders:
        - name: otel
          opentelemetry:
            service: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local
            port: 4317
    global:
      logAsJson: true
