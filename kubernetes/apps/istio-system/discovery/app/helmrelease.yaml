---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/helmrelease_v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-discovery
spec:
  interval: 15m
  chart:
    spec:
      chart: istiod
      version: 1.30.3
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    meshConfig:
      extensionProviders:
        - name: authentik
          envoyExtAuthzHttp:
            service: authentik-server.auth.svc.cluster.local
            port: 80
            timeout: 5s
            pathPrefix: /outpost.goauthentik.io/auth/envoy
            includeRequestHeadersInCheck:
              - cookie
            headersToUpstreamOnAllow:
              - set-cookie
              - x-authentik-email
              - x-authentik-groups
              - x-authentik-name
              - x-authentik-uid
              - x-authentik-username
            headersToDownstreamOnDeny:
              - content-type
              - set-cookie
    global:
      logAsJson: true
