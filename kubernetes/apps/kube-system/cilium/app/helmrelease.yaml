---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList: ["10.201.0.0/16"]
    tunnelPort: 8473 # non-default, see #2483
    kubeProxyReplacement: true
    k8sServiceHost: localhost # kubeprism
    k8sServicePort: 7445
    bgpControlPlane:
      enabled: true
    # Both required by istio ambient. exclusive lets istio-cni chain itself into
    # the conflist instead of cilium deleting it; hostNamespaceOnly keeps socket
    # LB out of the pod netns so ztunnel sees the original destination.
    cni:
      exclusive: false
    socketLB:
      hostNamespaceOnly: true
