---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Runs as a second, dormant overlay next to flannel: its own pod CIDR and
    # vxlan port, and customConf keeps it from writing a CNI config until a node
    # opts in via the CiliumNodeConfig. Everything below flips in later phases.
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList: ["10.201.0.0/16"]
    routingMode: tunnel
    tunnelProtocol: vxlan
    tunnelPort: 8473
    cni:
      customConf: true
      uninstall: false
    operator:
      unmanagedPodWatcher:
        restart: false
    policyEnforcementMode: never
    bpf:
      hostLegacyRouting: true
    kubeProxyReplacement: false

    # Without this, socket LB rewrites the destination inside the pod netns and
    # Envoy sees a backend IP instead of the ClusterIP, silently bypassing the
    # istio sidecars that every namespace gets by default.
    socketLB:
      hostNamespaceOnly: true
