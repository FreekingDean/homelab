---
# One pool per service, each pinned to the address it already holds. Unifi port
# forwards target these by IP, so a reassignment breaks external access with no
# self-healing. Selectors rather than lbipam.cilium.io/ips annotations because
# two of these services are not annotatable from git: authentik creates the ldap
# outpost at runtime, and satisfactory's service comes from inside its chart.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: traefik
spec:
  blocks:
    - start: "10.1.21.10"
      stop: "10.1.21.10"
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: networking
      io.kubernetes.service.name: traefik
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: authentik-ldap-outpost
spec:
  blocks:
    - start: "10.1.21.11"
      stop: "10.1.21.11"
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: auth
      io.kubernetes.service.name: ak-outpost-generic-ldap
---
apiVersion: cilium.io/v2
