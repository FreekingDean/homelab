      io.kubernetes.service.namespace: jitsi
      io.kubernetes.service.name: jitsi-jitsi-meet-jvb
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: jitsi-prosody
spec:
  blocks:
    - start: "10.1.21.13"
