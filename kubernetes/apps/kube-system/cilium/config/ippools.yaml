    matchLabels:
      io.kubernetes.service.namespace: jitsi
      io.kubernetes.service.name: jitsi-jitsi-meet-prosody
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: satisfactory
spec:
  blocks:
    - start: "10.1.21.14"
