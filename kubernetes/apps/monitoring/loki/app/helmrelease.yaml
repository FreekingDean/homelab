---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 30m
  timeout: 30m
  chart:
    spec:
      chart: loki
      version: 7.7.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    test:
      enabled: false
    lokiCanary:
      enabled: false
    global:
      extraArgs:
        - '-log.level=warn'
    loki:
      auth_enabled: false # Disable multi-tenancy
      storage:
        bucketNames:
          chunks: $${S3_LOKI_BUCKET}
          ruler: $${S3_LOKI_BUCKET}
          admin: $${S3_LOKI_BUCKET}
        type: s3
        s3:
          accessKeyId: $${S3_LOKI_ACCESS_KEY_ID}
          secretAccessKey: $${S3_LOKI_SECRET_ACCESS_KEY}
          endpoint: $${S3_LOKI_ENDPOINT}
          region: ""
          # RGW is addressed by IP, so virtual-hosted style (<bucket>.10.0.0.x) can't resolve.
          s3ForcePathStyle: true
          insecure: true
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      ingester:
        chunk_encoding: snappy
      querier:
        # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
        max_concurrent: 4
      pattern_ingester:
        enabled: true
      limits_config:
        ingestion_rate_mb: 1024
        ingestion_burst_size_mb: 2048
        max_global_streams_per_user: 100000000
        allow_structured_metadata: true
        volume_enabled: true
        # Logs arrive via OTLP from the otel collector. On top of Loki's default
        # index labels (service_name, k8s_namespace_name, k8s_container_name, ...)
        # also index pod and node; everything else becomes structured metadata.
        otlp_config:
          resource_attributes:
            attributes_config:
              - action: index_label
                attributes:
                  - k8s.pod.name
                  - k8s.node.name

    deploymentMode: SimpleScalable

    # The bucket's endpoint, name and keys come from loki-bucket-s3, which the
    # cosi-bucket component (ks.yaml) flattens out of the COSI BucketAccess
    # Secret.
    _deployment_template: &deployment_template
      extraArgs:
        - '-config.expand-env=true'
      extraEnv:
        - name: S3_LOKI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: loki-bucket-s3
              key: AWS_ENDPOINT_URL
        - name: S3_LOKI_BUCKET
          valueFrom:
            secretKeyRef:
              name: loki-bucket-s3
              key: BUCKET_NAME
        - name: S3_LOKI_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: loki-bucket-s3
              key: AWS_ACCESS_KEY_ID
        - name: S3_LOKI_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: loki-bucket-s3
              key: AWS_SECRET_ACCESS_KEY
    backend:
      <<: *deployment_template
      replicas: 3
      persistence:
        # Optane-backed pool (WAL / compactor working dir); chunks live in S3
        storageClass: fast-replica-block
        size: 10Gi
    read:
      <<: *deployment_template
      replicas: 3
    write:
      <<: *deployment_template
      replicas: 3 # To ensure data durability with replication
      persistence:
        # Optane-backed pool (WAL / compactor working dir); chunks live in S3
        storageClass: fast-replica-block
        size: 10Gi

    gateway:
      service:
        type: ClusterIP
      nginxConfig:
        logFormat: main
