---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/kustomization_v1beta2.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-loki
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-apps-ceph-csi-rbd
    - name: cluster-apps-ceph-csi-cephfs
    - name: cluster-apps-ceph-cosi-system-classes
    - name: cluster-apps-external-secrets
  path: ./kubernetes/apps/monitoring/loki/app
  components:
    - ../../../../components/cosi-bucket
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks: []
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      COSI_BUCKET: loki
      COSI_NAMESPACE: monitoring
