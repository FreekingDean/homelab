---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
spec:
  networkPolicy:
    enabled: false
  mode: daemonset
  image: otel/opentelemetry-collector-contrib:0.159.0
  envFrom:
    - secretRef:
        name: openobserve
  hostNetwork: true
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoExecute
    - key: CephOSDOnly
      operator: Exists
      effect: NoExecute
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  targetAllocator:
    enabled: true
    allocationStrategy: per-node
    replicas: 1
    prometheusCR:
      enabled: true
      scrapeInterval: 30s
      serviceMonitorSelector: &notScrapedByPrometheus
        matchExpressions:
          - key: monitoring.deangalvin.dev/scraper
            operator: NotIn
            values: [prometheus]
      podMonitorSelector: *notScrapedByPrometheus
      probeSelector: *notScrapedByPrometheus
      scrapeConfigSelector: *notScrapedByPrometheus
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs: []
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 90
        spike_limit_percentage: 20
      k8sattributes:
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
      transform/service_name:
        error_mode: ignore
        trace_statements:
          - set(resource.attributes["service.name"], Concat([resource.attributes["service.name"], "socket"], "-")) where IsMatch(resource.attributes["http.url"], "^wss?://|/websocket|/ws/")
            or IsMatch(resource.attributes["url.full"], "^wss?://|/websocket|/ws/")
          - set(resource.attributes["service.name"], Concat([resource.attributes["service.name"], "stream"], "-"))
            where IsMatch(resource.attributes["http.url"], "/[Vv]ideos/[^/]+/(stream|master|main|live|hls)")
            or IsMatch(resource.attributes["url.full"], "/[Vv]ideos/[^/]+/(stream|master|main|live|hls)")
      groupbyattrs:
        keys: [service.name]
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      otlp:
        endpoint: tempo:4317
        tls:
          insecure: true
      otlphttp/openobserve:
        endpoint: http://openobserve:5080/api/default
        headers:
          Authorization: $${env:OPENOBSERVE_AUTH_HEADER}
          stream-name: default
      prometheusremotewrite/replica-0: &prometheusremotewrite
        endpoint: http://prometheus-kube-prometheus-stack-prometheus-0.prometheus-operated:9090/api/v1/write
        target_info:
          enabled: false
        resource_to_telemetry_conversion:
          enabled: false
        remote_write_queue:
          num_consumers: 20
      prometheusremotewrite/replica-1:
        <<: *prometheusremotewrite
        endpoint: http://prometheus-kube-prometheus-stack-prometheus-1.prometheus-operated:9090/api/v1/write
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/service_name, groupbyattrs, batch]
          exporters: [otlp]
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite/replica-0, prometheusremotewrite/replica-1]
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
