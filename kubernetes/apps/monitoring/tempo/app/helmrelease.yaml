---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 30m
  timeout: 30m
  chart:
    spec:
      chart: tempo
      version: 1.24.4
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    tempo:
      retention: 168h
      # Traces live in a Ceph RGW bucket (COSI); the PVC below only holds the
      # WAL and metrics-generator blocks.
      storage:
        trace:
          backend: s3
          s3:
            bucket: $${TEMPO_S3_BUCKET}
            # Tempo wants host:port without a scheme, hence S3_ENDPOINT_HOST
            endpoint: $${TEMPO_S3_ENDPOINT}
            access_key: $${TEMPO_S3_ACCESS_KEY_ID}
            secret_key: $${TEMPO_S3_SECRET_ACCESS_KEY}
            insecure: true
            # RGW is addressed by IP, so virtual-hosted style can't resolve
            forcepathstyle: true
          wal:
            path: /var/tempo/wal
      extraArgs:
        config.expand-env: true
      # tempo-bucket-s3 is flattened out of the COSI BucketAccess Secret by the
      # cosi-bucket component (ks.yaml).
      extraEnv:
        - name: TEMPO_S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: tempo-bucket-s3
              key: BUCKET_NAME
        - name: TEMPO_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: tempo-bucket-s3
              key: S3_ENDPOINT_HOST
        - name: TEMPO_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: tempo-bucket-s3
              key: AWS_ACCESS_KEY_ID
        - name: TEMPO_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: tempo-bucket-s3
              key: AWS_SECRET_ACCESS_KEY
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://kube-prometheus-stack-prometheus:9090/api/v1/write
        processor:
          local_blocks:
            flush_to_storage: true
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
              - local-blocks
    persistence:
      enabled: true
      # Only the WAL and metrics-generator blocks live here now (traces are in S3),
      # on the Optane-backed pool
      size: 20Gi
      storageClassName: fast-replica-block
