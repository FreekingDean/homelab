---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "10.1.21.20"
    labels:
      service.istio.io/canonical-name: istio-gateway
  listeners:
    - name: deangalvin-dev
      protocol: HTTPS
      port: 443
      hostname: "deangalvin.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "${PRODUCTION_TLS}"
      allowedRoutes:
        namespaces:
          from: All
    - name: deangalvin-dev-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.deangalvin.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "${PRODUCTION_TLS}"
      allowedRoutes:
        namespaces:
          from: All
    - name: arcolog-com
      protocol: HTTPS
      port: 443
      hostname: "arcolog.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "${ARCOLOG_COM_PRODUCTION_TLS}"
      allowedRoutes:
        namespaces:
          from: All
    - name: arcolog-com-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.arcolog.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "${ARCOLOG_COM_PRODUCTION_TLS}"
      allowedRoutes:
        namespaces:
          from: All
    - name: glimmerlabs-io
      protocol: HTTPS
      port: 443
      hostname: "glimmerlabs.io"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "glimmerlabs-io-production-apex"
      allowedRoutes:
        namespaces:
          from: All
    - name: glimmerlabs-io-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.glimmerlabs.io"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "glimmerlabs-io-production-wildcard"
      allowedRoutes:
        namespaces:
          from: All
    - name: subtle-studio-com
      protocol: HTTPS
      port: 443
      hostname: "subtle-studio.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "subtle-studio-com-production-apex"
      allowedRoutes:
        namespaces:
          from: All
    - name: subtle-studio-com-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.subtle-studio.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: "subtle-studio-com-production-wildcard"
      allowedRoutes:
        namespaces:
          from: All
