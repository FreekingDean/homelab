---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: temporal
spec:
  version: 8.18.2
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
    # Renamed from "default" to move onto fast-replica-block: ECK can't change a
    # nodeSet's storage class in place, so it brings up the new nodeSet,
    # migrates shards onto it, then removes the old one.
    - name: fast
      count: 1
      config:
        node.store.allow_mmap: false
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
            storageClassName: fast-replica-block
