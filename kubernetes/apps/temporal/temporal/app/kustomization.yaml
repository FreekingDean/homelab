---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./pgcluster.yaml
  - ./elasticsearch.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: temporal-dashboard
    files:
      - ./dashboards/temporal.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
