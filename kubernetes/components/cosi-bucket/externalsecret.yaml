---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${COSI_BUCKET}-bucket-s3
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: ${COSI_BUCKET}-cosi
  target:
    name: ${COSI_BUCKET}-bucket-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        BUCKET_NAME: '{{ (.bucketInfo | fromJson).spec.bucketName }}'
        AWS_ENDPOINT_URL: '{{ (.bucketInfo | fromJson).spec.secretS3.endpoint }}'
        AWS_DEFAULT_REGION: '{{ (.bucketInfo | fromJson).spec.secretS3.region | default "us-east-1" }}'
        # RGW is addressed by IP, so virtual-hosted style can't resolve.
        AWS_S3_ADDRESSING_STYLE: path
        AWS_ACCESS_KEY_ID: '{{ (.bucketInfo | fromJson).spec.secretS3.accessKeyID }}'
        AWS_SECRET_ACCESS_KEY: '{{ (.bucketInfo | fromJson).spec.secretS3.accessSecretKey }}'
        S3_ENDPOINT_HOST: '{{ (.bucketInfo | fromJson).spec.secretS3.endpoint | trimPrefix "https://" | trimPrefix "http://" }}'
  data:
    - secretKey: bucketInfo
      remoteRef:
        key: ${COSI_BUCKET}-bucket-credentials
        property: BucketInfo
