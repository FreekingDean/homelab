---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ${COSI_BUCKET}-cosi
spec:
  provider:
    kubernetes:
      remoteNamespace: ${COSI_NAMESPACE}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ${COSI_BUCKET}-cosi-reader
